<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job tracker{% endblock %}</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: #1c1917;
      background: #f6f5f3;
    }
    header {
      background: #1c1917;
      padding: 0.8rem 1.5rem;
    }
    header a {
      color: #fafaf9;
      text-decoration: none;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 { margin: 0 0 1rem; font-weight: 600; }
    a { color: #1d4ed8; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      text-align: left;
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid #e7e5e4;
      vertical-align: middle;
    }
    th {
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #57534e;
    }
    form p { margin: 0 0 0.9rem; }
    label {
      display: block;
      margin-bottom: 0.25rem;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
    }
    input, select, textarea {
      font: inherit;
      padding: 0.4rem 0.5rem;
      border: 1px solid #d6d3d1;
      background: white;
      width: 100%;
      max-width: 28rem;
      box-sizing: border-box;
    }
    button, .button {
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      background: #1c1917;
      color: white;
      border: 0;
      padding: 0.4rem 0.75rem;
      text-decoration: none;
      cursor: pointer;
    }
    .actions { white-space: nowrap; }
    .actions form { display: inline; }
    .actions button {
      background: white;
      color: #1c1917;
      border: 1px solid #d6d3d1;
      margin-left: 0.4rem;
    }
    .add { display: inline-block; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'home' %}">Job tracker</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
